<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasa i płatność | Reksie i Azorki</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DynaPuff:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="page-padding-top bg-light">
  <div id="site-header"></div>
  <main class="container py-4">
    <div class="row pb-5 mt-3">
      <div class="col-12 mb-4">
        <h1>Finalizacja zamówienia</h1>
      </div>
      <div class="col-lg-8 mb-5 mb-lg-0">
        <form>
          <div class="bg-white p-4 p-md-5 rounded shadow-sm border mb-4">
            <h3 class="h5 border-bottom pb-3 mb-4">1. Dane bilingowe i adres dostawy</h3>
            <div class="row g-3">
              <div class="col-sm-6"><label class="form-label">Imię</label><input type="text" class="form-control" required></div>
              <div class="col-sm-6"><label class="form-label">Nazwisko</label><input type="text" class="form-control" required></div>
              <div class="col-12"><label class="form-label">Ulica i numer</label><input type="text" class="form-control" required></div>
              <div class="col-sm-4"><label class="form-label">Kod pocztowy</label><input type="text" class="form-control" placeholder="00-000" required></div>
              <div class="col-sm-8"><label class="form-label">Miasto</label><input type="text" class="form-control" required></div>
              <div class="col-sm-6"><label class="form-label">Telefon</label><input type="tel" class="form-control" required></div>
              <div class="col-sm-6"><label class="form-label">E-mail</label><input type="email" class="form-control" required></div>
            </div>
            <div class="form-check mt-4">
              <input class="form-check-input" type="checkbox" id="fakturaCheck" data-bs-toggle="collapse" data-bs-target="#fakturaFields">
              <label class="form-check-label fw-bold" for="fakturaCheck">Chcę otrzymać fakturę na firmę</label>
            </div>
            <div class="collapse mt-3" id="fakturaFields">
              <div class="row g-3 bg-light p-3 rounded border">
                <div class="col-sm-4"><label class="form-label">NIP</label><input type="text" class="form-control"></div>
                <div class="col-sm-8"><label class="form-label">Nazwa firmy</label><input type="text" class="form-control"></div>
              </div>
            </div>
          </div>
          <div class="bg-white p-4 p-md-5 rounded shadow-sm border mb-4">
            <h3 class="h5 border-bottom pb-3 mb-4">2. Metoda dostawy</h3>
            <div class="list-group">
              <label class="list-group-item d-flex gap-3 p-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="delivery" value="paczkomat" checked>
                <span class="d-block w-100 d-flex justify-content-between">
                  <span><strong>Paczkomat InPost</strong><br><small class="text-muted">Odbiór w 1-2 dni robocze</small></span>
                  <span class="fw-bold">14,90 zł</span>
                </span>
              </label>
              <label class="list-group-item d-flex gap-3 p-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="delivery" value="kurier">
                <span class="d-block w-100 d-flex justify-content-between">
                  <span><strong>Kurier DPD</strong><br><small class="text-muted">Dostawa prosto pod drzwi</small></span>
                  <span class="fw-bold">18,50 zł</span>
                </span>
              </label>
              <label class="list-group-item d-flex gap-3 p-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="delivery" value="odbiór">
                <span class="d-block w-100 d-flex justify-content-between">
                  <span><strong>Odbiór osobisty</strong><br><small class="text-muted">Ul. Psia 12, Warszawa</small></span>
                  <span class="fw-bold">0,00 zł</span>
                </span>
              </label>
            </div>
          </div>
          <div class="bg-white p-4 p-md-5 rounded shadow-sm border mb-4">
            <h3 class="h5 border-bottom pb-3 mb-4">3. Metoda płatności</h3>
            <div class="form-check mb-3">
              <input class="form-check-input" type="radio" name="payment" id="pay1" checked>
              <label class="form-check-label d-flex align-items-center" for="pay1"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Blik_logo.svg" alt="BLIK" height="20" class="me-2"> Szybka płatność BLIK</label>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="radio" name="payment" id="pay2">
              <label class="form-check-label" for="pay2"><i class="bi bi-credit-card me-2"></i>Karta płatnicza (Visa, Mastercard)</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment" id="pay3">
              <label class="form-check-label" for="pay3"><i class="bi bi-bank me-2"></i>Szybki przelew online (Przelewy24)</label>
            </div>
          </div>
          <div class="bg-white p-4 p-md-5 rounded shadow-sm border">
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="regulamin" required>
              <label class="form-check-label small" for="regulamin">Oświadczam, że akceptuję <a href="#">Regulamin sklepu</a> oraz zapoznałem/am się z <a href="#">Polityką Prywatności</a>. *</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="newsletter">
              <label class="form-check-label small" for="newsletter">Zapisz mnie do psiego newslettera (promocje i poradniki).</label>
            </div>
          </div>
        </form>
      </div>
      <div class="col-lg-4">
        <div class="card border shadow-sm checkout-summary">
          <div class="card-header bg-dark text-white py-3">
            <h4 class="card-title h6 mb-0">Twoje zamówienie</h4>
          </div>
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="d-flex align-items-center gap-2">
                <span class="badge bg-secondary rounded-circle px-2 py-1">1</span>
                <span class="small fw-medium">Szelki Guard Pro (M)</span>
              </div>
              <span class="small">129,00 zł</span>
            </div>
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
              <div class="d-flex align-items-center gap-2">
                <span class="badge bg-secondary rounded-circle px-2 py-1">2</span>
                <span class="small fw-medium">Mata węchowa „Las”</span>
              </div>
              <span class="small">142,40 zł</span>
            </div>
            <div class="d-flex justify-content-between mb-2 text-muted small">
              <span>Wartość koszyka</span>
              <span>271,40 zł</span>
            </div>
            <div class="d-flex justify-content-between mb-3 text-muted small border-bottom pb-3">
              <span>Dostawa (Paczkomat)</span>
              <span>14,90 zł</span>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4 text-dark">
              <span class="fs-5 fw-bold">Do zapłaty</span>
              <span class="fs-4 fw-bold">286,30 zł</span>
            </div>
            <a href="konto.html" class="btn btn-brand btn-lg w-100"><i class="bi bi-lock-fill me-2"></i>Kupuję i płacę</a>
            <p class="text-center text-muted small mt-3 mb-0"><i class="bi bi-shield-lock"></i> Bezpieczne zakupy SSL</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
