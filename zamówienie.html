<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasa i płatność | Reksie i Azorki</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DynaPuff:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="page-padding-top bg-light">
  <div id="site-header"></div>
  <main class="container py-4">
    <div class="row pb-5 mt-3">
      <div class="col-12 mb-4">
        <h1>Finalizacja zamówienia</h1>
      </div>
      <div class="col-lg-8 mb-5 mb-lg-0">
        <form action="konto.html">
          <!-- 1. Dane bilingowe -->
          <div class="bg-white p-4 p-md-5 rounded shadow-sm border mb-4">
            <h3 class="h5 border-bottom pb-3 mb-4">1. Dane bilingowe i adres dostawy</h3>
            <div class="row g-3">
              <div class="col-sm-6"><label class="form-label">Imię *</label><input type="text" class="form-control" required></div>
              <div class="col-sm-6"><label class="form-label">Nazwisko *</label><input type="text" class="form-control" required></div>
              <div class="col-sm-6"><label class="form-label">E-mail *</label><input type="email" class="form-control" required></div>
              <div class="col-sm-6"><label class="form-label">Telefon *</label><input type="tel" class="form-control" required></div>
              <div class="col-12"><label class="form-label">Ulica i numer *</label><input type="text" class="form-control" required></div>
              <div class="col-sm-4"><label class="form-label">Kod pocztowy *</label><input type="text" class="form-control" required></div>
              <div class="col-sm-8"><label class="form-label">Miasto *</label><input type="text" class="form-control" required></div>
            </div>
            
            <div class="form-check mt-4 mb-2">
              <input class="form-check-input" type="checkbox" id="fakturaCheck" data-bs-toggle="collapse" data-bs-target="#fakturaFields" aria-expanded="false">
              <label class="form-check-label fw-bold" for="fakturaCheck">Chcę otrzymać fakturę na firmę</label>
            </div>
            <div class="collapse" id="fakturaFields">
              <div class="row g-3 mt-1 p-3 bg-light rounded border">
                 <div class="col-sm-4"><label class="form-label">NIP</label><input type="text" class="form-control"></div>
                 <div class="col-sm-8"><label class="form-label">Nazwa firmy</label><input type="text" class="form-control"></div>
              </div>
            </div>
          </div>

          <!-- 2. Dostawa -->
          <div class="bg-white p-4 p-md-5 rounded shadow-sm border mb-4">
            <h3 class="h5 border-bottom pb-3 mb-4">2. Metoda dostawy</h3>
            <div class="list-group">
              <label class="list-group-item d-flex gap-3 p-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="delivery" value="paczkomat" checked>
                <span class="d-block w-100 d-flex justify-content-between">
                  <span><strong>Paczkomat InPost</strong></span>
                  <span class="fw-bold">14,90 zł</span>
                </span>
              </label>
              <label class="list-group-item d-flex gap-3 p-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="delivery" value="kurier">
                <span class="d-block w-100 d-flex justify-content-between">
                  <span><strong>Kurier DPD</strong></span>
                  <span class="fw-bold">18,50 zł</span>
                </span>
              </label>
              <label class="list-group-item d-flex gap-3 p-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="delivery" value="odbior">
                <span class="d-block w-100 d-flex justify-content-between">
                  <span><strong>Odbiór osobisty (Warszawa)</strong></span>
                  <span class="fw-bold">0,00 zł</span>
                </span>
              </label>
            </div>
          </div>

          <!-- 3. Płatność -->
          <div class="bg-white p-4 p-md-5 rounded shadow-sm border mb-4">
            <h3 class="h5 border-bottom pb-3 mb-4">3. Metoda płatności</h3>
            <div class="list-group mb-4">
              <label class="list-group-item d-flex gap-3 p-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="payment" id="pay1" checked>
                <span><strong>Szybka płatność BLIK</strong></span>
              </label>
              <label class="list-group-item d-flex gap-3 p-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="payment" id="pay2">
                <span><strong>Karta płatnicza (Stripe)</strong></span>
              </label>
              <label class="list-group-item d-flex gap-3 p-3">
                <input class="form-check-input flex-shrink-0" type="radio" name="payment" id="pay3">
                <span><strong>Szybki przelew online</strong></span>
              </label>
            </div>
            
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="regulamin" required>
              <label class="form-check-label small" for="regulamin">Akceptuję <a href="#">Regulamin Sklepu</a> oraz potwierdzam zapoznanie się z <a href="#">Polityką Prywatności</a>. *</label>
            </div>
          </div>
          
          <!-- Ukryty submit używany w przypadku braku JS, normalnie obsługiwany przez link/JS podsumowania. -->
          <button type="submit" id="realSubmitBtn" class="d-none">Submit</button>
        </form>
      </div>

      <!-- Podsumowanie zakupu (Prawa kolumna) -->
      <div class="col-lg-4">
        <div class="card border shadow-sm checkout-summary">
          <div class="card-header bg-dark text-white py-3">
            <h4 class="card-title h6 mb-0">Twoje zamówienie</h4>
          </div>
          <div class="card-body p-4">
            <div class="mb-3 border-bottom pb-3 small">
              <div class="d-flex justify-content-between mb-1"><span>1x Szelki Guard Pro</span><span>129,00 zł</span></div>
              <div class="d-flex justify-content-between mb-1"><span>1x Mata węchowa</span><span>71,20 zł</span></div>
            </div>
            <div class="d-flex justify-content-between mb-2 text-muted small">
              <span>Wartość koszyka</span>
              <span>200,20 zł</span>
            </div>
            <div class="d-flex justify-content-between mb-3 text-muted small border-bottom pb-3">
              <span>Dostawa (Paczkomat)</span>
              <span>14,90 zł</span>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4 text-dark">
              <span class="fs-5 fw-bold">Do zapłaty</span>
              <span class="fs-4 fw-bold">215,10 zł</span>
            </div>
            <!-- Z racji formy HTML ten przycisk symuluje kliknięcie submit -->
            <button onclick="document.getElementById('realSubmitBtn').click(); window.location.href='konto.html';" class="btn btn-brand btn-lg w-100"><i class="bi bi-lock-fill me-2"></i>Kupuję i płacę</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
