<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zamówienie – Reksie i Azorki</title>
<meta name="description" content="Realizacja zamówienia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=DynaPuff:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#tresc">Przejdź do treści</a>
<div id="site-header"></div>
<main id="tresc" class="shop-page">
<div class="container">
<nav aria-label="breadcrumb"><ol class="breadcrumb">
<li class="breadcrumb-item"><a href="index.html">Strona główna</a></li>
<li class="breadcrumb-item"><a href="koszyk.html">Koszyk</a></li>
<li class="breadcrumb-item active" aria-current="page">Zamówienie</li>
</ol></nav>
<h1 class="mb-4">Kasa</h1>
<form action="konto.html" class="row g-4">
<div class="col-lg-8">
<fieldset class="card p-4 mb-4"><legend class="h4">1. Dane i adres dostawy</legend>
<div class="row g-3">
<div class="col-md-6"><label for="imie" class="form-label">Imię</label><input type="text" class="form-control" id="imie" required></div>
<div class="col-md-6"><label for="nazwisko" class="form-label">Nazwisko</label><input type="text" class="form-control" id="nazwisko" required></div>
<div class="col-12"><label for="ulica" class="form-label">Ulica i numer</label><input type="text" class="form-control" id="ulica" required></div>
<div class="col-md-4"><label for="kod" class="form-label">Kod pocztowy</label><input type="text" class="form-control" id="kod" required></div>
<div class="col-md-8"><label for="miasto" class="form-label">Miasto</label><input type="text" class="form-control" id="miasto" required></div>
<div class="col-md-6"><label for="tel" class="form-label">Telefon</label><input type="tel" class="form-control" id="tel" required></div>
<div class="col-md-6"><label for="email" class="form-label">E-mail</label><input type="email" class="form-control" id="email" required></div>
</div>
<div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="faktura" data-bs-toggle="collapse" data-bs-target="#firma" aria-controls="firma"><label class="form-check-label" for="faktura">Chcę otrzymać fakturę na firmę</label></div>
<div class="collapse" id="firma"><div class="row g-3 mt-1">
<div class="col-md-6"><label for="nip" class="form-label">NIP</label><input type="text" class="form-control" id="nip"></div>
<div class="col-md-6"><label for="firmaN" class="form-label">Nazwa firmy</label><input type="text" class="form-control" id="firmaN"></div>
</div></div>
</fieldset>
<fieldset class="card p-4 mb-4"><legend class="h4">2. Dostawa</legend>
<div class="form-check option-box"><input class="form-check-input" type="radio" name="dost" id="dost1" checked><label class="form-check-label d-flex justify-content-between w-100" for="dost1"><span><i class="bi bi-truck"></i> Kurier</span><span class="text-muted">14,99 zł</span></label></div>
<div class="form-check option-box"><input class="form-check-input" type="radio" name="dost" id="dost2"><label class="form-check-label d-flex justify-content-between w-100" for="dost2"><span><i class="bi bi-box-seam"></i> Paczkomat</span><span class="text-muted">11,99 zł</span></label></div>
<div class="form-check option-box"><input class="form-check-input" type="radio" name="dost" id="dost3"><label class="form-check-label d-flex justify-content-between w-100" for="dost3"><span><i class="bi bi-shop"></i> Odbiór osobisty</span><span class="text-muted">0,00 zł</span></label></div>
</fieldset>
<fieldset class="card p-4"><legend class="h4">3. Płatność</legend>
<div class="form-check option-box"><input class="form-check-input" type="radio" name="plat" id="plat1" checked><label class="form-check-label d-flex justify-content-between w-100" for="plat1"><span><i class="bi bi-phone"></i> BLIK</span><span class="text-muted"></span></label></div>
<div class="form-check option-box"><input class="form-check-input" type="radio" name="plat" id="plat2"><label class="form-check-label d-flex justify-content-between w-100" for="plat2"><span><i class="bi bi-credit-card"></i> Karta płatnicza</span><span class="text-muted"></span></label></div>
<div class="form-check option-box"><input class="form-check-input" type="radio" name="plat" id="plat3"><label class="form-check-label d-flex justify-content-between w-100" for="plat3"><span><i class="bi bi-lightning-charge"></i> Szybki przelew</span><span class="text-muted"></span></label></div>
</fieldset>
</div>
<div class="col-lg-4">
<div class="card summary-card p-4">
<h2 class="h4">Twoje zamówienie</h2>
<ul class="list-unstyled summary-list">
<li><span>Szelki Comfort Walk × 1</span><span>119,00 zł</span></li>
<li><span>Gryzak linowy XL × 2</span><span>79,98 zł</span></li>
<li><span>Dostawa: Kurier</span><span>14,99 zł</span></li>
<li class="summary-total"><span>Do zapłaty</span><span>213,97 zł</span></li>
</ul>
<div class="form-check"><input class="form-check-input" type="checkbox" id="reg" required><label class="form-check-label" for="reg">Akceptuję <a href="#">regulamin</a> sklepu *</label></div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="rodo" required><label class="form-check-label" for="rodo">Zapoznałem/am się z <a href="#">polityką prywatności</a> *</label></div>
<a href="konto.html?zamowienie=ok" class="btn btn-brand btn-lg w-100"><i class="bi bi-bag-check"></i> Kupuję i płacę</a>
</div>
</div>
</form>
</div>
</main>
<div id="site-footer"></div>
<script src="js/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
