<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koszyk zakupowy | Reksie i Azorki</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DynaPuff:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="page-padding-top">
  <div id="site-header"></div>
  <main class="container py-4">
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Strona główna</a></li>
        <li class="breadcrumb-item"><a href="sklep.html">Sklep</a></li>
        <li class="breadcrumb-item active" aria-current="page">Twój koszyk</li>
      </ol>
    </nav>
    <div class="row pb-5">
      <div class="col-12 mb-4">
        <h1>Twój koszyk</h1>
      </div>
      <div class="col-lg-8 mb-5 mb-lg-0">
        <div class="table-responsive bg-white rounded shadow-sm border p-3 mb-4">
          <table class="table table-borderless align-middle mb-0 cart-table">
            <thead class="border-bottom">
              <tr>
                <th scope="col">Produkt</th>
                <th scope="col" class="text-end">Cena</th>
                <th scope="col" class="text-center">Ilość</th>
                <th scope="col" class="text-end">Wartość</th>
                <th scope="col" class="text-center">Usuń</th>
              </tr>
            </thead>
            <tbody>
              <tr class="border-bottom">
                <td>
                  <div class="d-flex align-items-center gap-3 py-2">
                    <img src="assets/dog-3.jpg" class="cart-item-img border" alt="Szelki">
                    <div>
                      <h6 class="mb-0"><a href="produkt.html" class="text-dark text-decoration-none fw-bold">Szelki Guard Pro</a></h6>
                      <small class="text-muted">Rozmiar: M</small>
                    </div>
                  </div>
                </td>
                <td class="text-end fw-medium">129,00 zł</td>
                <td><input type="number" class="form-control form-control-sm mx-auto text-center qty-input" value="1" min="1"></td>
                <td class="text-end fw-bold">129,00 zł</td>
                <td class="text-center"><button class="btn btn-link text-danger p-0" aria-label="Usuń"><i class="bi bi-trash fs-5"></i></button></td>
              </tr>
              <tr>
                <td>
                  <div class="d-flex align-items-center gap-3 py-2">
                    <img src="assets/dog-4.jpg" class="cart-item-img border" alt="Mata">
                    <div>
                      <h6 class="mb-0"><a href="produkt.html" class="text-dark text-decoration-none fw-bold">Mata węchowa „Las”</a></h6>
                      <small class="text-muted">Rozmiar: Uniwersalny</small>
                    </div>
                  </div>
                </td>
                <td class="text-end fw-medium">71,20 zł</td>
                <td><input type="number" class="form-control form-control-sm mx-auto text-center qty-input" value="1" min="1"></td>
                <td class="text-end fw-bold">71,20 zł</td>
                <td class="text-center"><button class="btn btn-link text-danger p-0" aria-label="Usuń"><i class="bi bi-trash fs-5"></i></button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card border shadow-sm checkout-summary">
          <div class="card-body p-4">
            <h4 class="card-title h5 mb-4">Podsumowanie</h4>
            <div class="d-flex justify-content-between mb-4 fs-4 fw-bold">
              <span>Razem</span>
              <span>200,20 zł</span>
            </div>
            <a href="zamowienie.html" class="btn btn-brand btn-lg w-100 mb-3">Przejdź do kasy <i class="bi bi-arrow-right ms-1"></i></a>
            <a href="sklep.html" class="btn btn-outline-secondary w-100">Kontynuuj zakupy</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
